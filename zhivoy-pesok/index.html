<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Живой песок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Piazzolla:ital,opsz,wght@0,8..30,300..600;1,8..30,300..600&display=swap">
<style>
  :root {
    --ink: #1b2a4a;
    --soft: #56606f;
    --indigo: #27406e;
    --garnet: #7b2337;
    --ochre: #a87518;
    --moss: #5e6b34;
    --pine: #1f4d40;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: #fff;
    color: var(--ink);
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    background: #eddbbb url('./sand-grain.jpg') center / cover no-repeat;
    font-family: Piazzolla, Georgia, serif;
    font-size: 17px;
    line-height: 1.45;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: crosshair;
  }
  .panel {
    position: fixed;
    z-index: 2;
    left: clamp(20px, 4vw, 56px);
    bottom: clamp(20px, 4vw, 48px);
    width: min(25.5rem, calc(100vw - 40px));
  }
  .panel-heading { display: flex; align-items: baseline; gap: .85rem; }
  h1 {
    margin: 0 0 .3em;
    font-size: clamp(2.7rem, 5.1vw, 3.8rem);
    font-style: italic;
    font-weight: 400;
    line-height: 1;
    letter-spacing: -.01em;
  }
  .lead { margin: 0 0 .9rem; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: grid;
    grid-template-columns: .7rem 1fr;
    gap: .65rem;
    align-items: baseline;
    padding: .1rem 0;
    color: var(--soft);
    transition: color .4s;
  }
  li::before {
    content: "";
    width: .62rem;
    height: .62rem;
    border: 1.5px solid var(--pigment);
    border-radius: 50%;
    transition: background-color .4s;
  }
  li.done { color: var(--ink); }
  li.done::before { background-color: var(--pigment); }
  .pulse-status { margin: .7rem 0 .42rem; color: var(--soft); font-size: .85rem; }
  .panel::before {
    content: "";
    position: absolute;
    z-index: -1;
    inset: -1rem -1.25rem;
    background: #f8efddad;
    border-radius: 1.2rem;
    filter: blur(12px);
    pointer-events: none;
  }
  #hints { max-height: 52svh; overflow: auto; overscroll-behavior: contain; }
  .status {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    margin-top: .1rem;
    font-variant-numeric: tabular-nums;
  }
  button {
    padding: 0;
    font: inherit;
    color: var(--ink);
    background: none;
    border: 0;
    border-bottom: 1.5px solid var(--indigo);
    cursor: pointer;
  }
  button:hover { color: var(--garnet); border-color: var(--garnet); }
  button:focus-visible { outline: 2px solid var(--garnet); outline-offset: 3px; }
  .hints-toggle { font-size: .8rem; white-space: nowrap; }
  .stone {
    position: fixed;
    z-index: 1;
    top: 0;
    left: 0;
    width: var(--size);
    aspect-ratio: 1;
    min-width: 44px;
    border: 0;
    border-radius: 50%;
    touch-action: none;
    cursor: grab;
    transform: translate3d(var(--x), var(--y), 0) translate(-50%, -50%);
  }
  .stone::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--asset, url('./river-stones.png')) var(--sprite) center / var(--cells, 300%) 100% no-repeat;
    filter: drop-shadow(2px 5px 3px #382d2454);
    transform: rotate(var(--angle));
    transition: filter .2s ease;
  }
  .stone[data-dragging] { cursor: grabbing; z-index: 2; }
  .stone[data-dragging]::before { filter: drop-shadow(4px 8px 5px #382d245a); }
  .stone[aria-pressed="false"]::before { opacity: .42; }
  .stone-slate { --size: clamp(77px, 11.5vw, 150px); --sprite: 0%; --angle: -12deg; }
  .stone-ochre { --size: clamp(67px, 10vw, 126px); --sprite: 50%; --angle: 19deg; }
  .garden-object { --asset: url('./garden-objects.png'); --cells: 400%; }
  .branch { --size: clamp(64px, 9vw, 110px); --sprite: 100%; --angle: -17deg; }
  .bowl, .leaf { --asset: url('./bowl-and-leaf.png'); --cells: 200%; }
  .bowl { --size: clamp(71px, 9vw, 115px); --sprite: 0%; --angle: 9deg; cursor: pointer; }
  .leaf { --size: clamp(62px, 7.5vw, 96px); --sprite: 100%; --angle: 15deg; }
  .branch::before { clip-path: polygon(1% 89%, 10% 80%, 29% 64%, 45% 48%, 54% 34%, 63% 23%, 76% 11%, 89% 0, 94% 0, 92% 8%, 80% 16%, 70% 27%, 62% 42%, 57% 51%, 67% 49%, 79% 44%, 89% 38%, 96% 37%, 93% 43%, 83% 50%, 69% 56%, 51% 60%, 37% 72%, 19% 88%, 10% 97%, 4% 98%); }
  @media (max-height: 560px) {
    .lead { display: none; }
  }
</style>
</head>
<body>
<canvas id="plate" role="img" aria-label="Песок на вибрирующей пластине. Узор меняется от движений курсора, нажатий, колеса мыши и клавиш."></canvas>
<div id="stones" hidden>
  <button class="stone stone-slate" type="button" aria-label="Тёмный камень" aria-describedby="stone-controls" data-role="rock"></button>
  <button class="stone stone-ochre" type="button" aria-label="Светлый камень" aria-describedby="stone-controls" data-role="rock"></button>
  <button class="stone leaf" type="button" aria-label="Лист" aria-describedby="leaf-controls" data-role="leaf"></button>
  <button class="stone garden-object branch" type="button" aria-label="Веточка" aria-describedby="branch-controls" aria-pressed="true" data-role="branch"></button>
  <button class="stone bowl" type="button" aria-label="Поющая чаша" aria-describedby="bowl-controls" data-role="bowl"></button>
</div>

<section class="panel">
  <div class="panel-heading">
    <h1>Живой песок</h1>
    <button class="hints-toggle" id="hints-toggle" type="button" aria-expanded="true" aria-controls="hints">Свернуть</button>
  </div>
  <div id="hints">
    <p class="lead" id="lead">Собери свою музыку из песка и звуков.</p>
    <ul>
      <li data-action="rock" id="stone-controls" style="--pigment: var(--indigo)">Камни меняют гармонию.</li>
      <li data-action="leaf" id="leaf-controls" style="--pigment: var(--moss)">Лист ближе к центру добавляет пульс.</li>
      <li data-action="branch" id="branch-controls" style="--pigment: var(--pine)">Передвинь веточку, и прозвучит флейта.</li>
      <li data-action="bowl" id="bowl-controls" style="--pigment: var(--ochre)">Коснись чаши, чтобы она зазвучала.</li>
    </ul>
    <p class="pulse-status" id="pulse-status">Пульс 0%</p>
  </div>
  <div class="status">
    <span id="readout">Вибрация 45%</span>
    <button id="sound" type="button">Включить звук</button>
  </div>
</section>

<script type="module">
import { createSoundscape, leafPulse, stoneHarmony } from './soundscape.js';

(() => {
  'use strict';

  const canvas = document.getElementById('plate');
  const panel = document.querySelector('.panel');
  const readout = document.getElementById('readout');
  const pulseStatus = document.getElementById('pulse-status');
  const soundButton = document.getElementById('sound');
  const hints = document.getElementById('hints');
  const hintsToggle = document.getElementById('hints-toggle');
  hintsToggle.addEventListener('click', () => {
    hints.hidden = !hints.hidden;
    hintsToggle.setAttribute('aria-expanded', String(!hints.hidden));
    hintsToggle.textContent = hints.hidden ? 'Подсказки' : 'Свернуть';
  });

  const gl = canvas.getContext('webgl', {
    alpha: true,
    antialias: false,
    powerPreference: 'high-performance',
  });
  if (!gl) {
    document.getElementById('lead').textContent =
      'Этот браузер не запускает WebGL. Включи аппаратное ускорение или открой страницу в другом браузере.';
    return;
  }

  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const PIGMENT = {
    indigo: [0.41, 0.33, 0.26],
    pine: [0.40, 0.37, 0.26],
    garnet: [0.51, 0.35, 0.26],
  };
  const OCHRE = [0.71, 0.48, 0.26];

  /* ---------- Размеры и таблицы волны ---------- */

  let W = 0, H = 0, S = 1, dpr = 1;
  let keepRight = 0, keepTop = 0;
  let ux, uy;
  const scales = [1, 2, 4];
  let fields;
  const stoneLayer = document.getElementById('stones');
  const objects = Array.from(stoneLayer.querySelectorAll('.stone'), (element) => ({
    element,
    size: 0,
    x: 0,
    y: 0,
    active: true,
    energy: 0,
  }));
  const [firstRock, secondRock, leaf, branch, bowl] = objects;
  const stones = [firstRock, secondRock];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(innerWidth, 2);
    H = Math.max(innerHeight, 2);
    S = Math.min(W, H);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);

    ux = new Float32Array(W);
    uy = new Float32Array(H);
    for (let i = 0; i < W; i++) ux[i] = (i - W / 2) / S;
    for (let i = 0; i < H; i++) uy[i] = (i - H / 2) / S;
    fields = scales.map((scale) => ({
      scale,
      cnx: new Float32Array(W), cmx: new Float32Array(W),
      dnx: new Float32Array(W), dmx: new Float32Array(W),
      cny: new Float32Array(H), cmy: new Float32Array(H),
      dny: new Float32Array(H), dmy: new Float32Array(H),
    }));

    measurePanel();
  }

  function measurePanel() {
    const box = panel.getBoundingClientRect();
    keepRight = box.right + 22;
    keepTop = box.top - 22;
  }

  /* ---------- Песчинки ---------- */

  resize();
  stoneLayer.hidden = false;
  const stonePositions = W < 650
    ? [[.22, .19], [.53, .28], [.81, .32], [.67, .12], [.82, .48]]
    : [[.29, .27], [.52, .43], [.87, .56], [.73, .23], [.72, .70]];
  objects.forEach((stone, i) => {
    stone.size = stone.element.offsetWidth;
    placeStone(stone, W * stonePositions[i][0], H * stonePositions[i][1]);
  });
  // Считаем от экрана, а не от окна: вкладка может открыться в фоне с нулевым размером.
  const COUNT = Math.round(Math.min(170000, Math.max(50000, screen.width * screen.height * 0.11)));
  const HEAVY = Math.round(COUNT * 0.8);
  const MEDIUM_GRAINS = Math.round(HEAVY * 0.64);
  const FINE_GRAINS = Math.round(HEAVY * 0.89);
  const pos = new Float32Array(COUNT * 2);
  const vel = new Float32Array(COUNT * 2);

  function scatter() {
    const top = Math.max(1, Math.min(keepTop, H));
    const side = Math.max(0, Math.min(keepRight, W));
    const abovePanel = W * top;
    const besidePanel = (W - side) * (H - top);
    for (let i = 0; i < COUNT; i++) {
      const above = Math.random() * (abovePanel + besidePanel) < abovePanel;
      pos[i * 2] = above ? Math.random() * W : side + Math.random() * (W - side);
      pos[i * 2 + 1] = above ? Math.random() * top : top + Math.random() * (H - top);
      vel[i * 2] = 0;
      vel[i * 2 + 1] = 0;
    }
  }
  scatter();

  const NOISE = new Float32Array(1 << 16);
  for (let i = 0; i < NOISE.length; i++) NOISE[i] = Math.random() * 2 - 1;

  /* ---------- Состояние пластины ---------- */

  let n = 3, m = 5, targetN = 3, targetM = 5;
  let drive = 0.45;
  let excite = 0;
  let lastTouch = performance.now(), wander = 0;
  const strikes = [];
  const heavyColor = PIGMENT.indigo.slice();
  let heavyTarget = PIGMENT.indigo;

  // Чем мельче узор, тем выше тон. Диапазон 165–990 Гц мягкий и слышен на ноутбуке.
  const toHz = (a, b) => 165 * 6 ** (Math.log((a * a + b * b) / 5) / Math.log(193 / 5));

  function buildTables() {
    const gn = n / (n + m), gm = m / (n + m);
    for (const { scale, cnx, cmx, dnx, dmx, cny, cmy, dny, dmy } of fields) {
      const pn = Math.PI * n * scale, pm = Math.PI * m * scale;
      for (let i = 0; i < W; i++) {
        cnx[i] = Math.cos(pn * ux[i]);
        cmx[i] = Math.cos(pm * ux[i]);
        dnx[i] = -gn * Math.sin(pn * ux[i]);
        dmx[i] = -gm * Math.sin(pm * ux[i]);
      }
      for (let i = 0; i < H; i++) {
        cny[i] = Math.cos(pn * uy[i]);
        cmy[i] = Math.cos(pm * uy[i]);
        dny[i] = -gn * Math.sin(pn * uy[i]);
        dmy[i] = -gm * Math.sin(pm * uy[i]);
      }
    }
  }

  function step() {
    n += (targetN - n) * 0.06;
    m += (targetM - m) * 0.06;
    buildTables();
    excite *= 0.96;
    for (const stone of stones) stone.energy *= 0.95;

    // Если ничего не трогать, узор медленно плывёт сам, а созвучие пересобирается.
    if (!calm && performance.now() - lastTouch > 6000) {
      wander += 0.00035;
      const driftN = 4 + 3 * Math.sin(wander);
      const driftM = driftN + 3 + 2 * Math.sin(wander * 1.618 + 1);
      targetN += (driftN - targetN) * 0.002;
      targetM += (driftM - targetM) * 0.002;
    }

    const shake = (0.35 + 2.4 * drive * drive + excite * 2.2) * (calm ? 0.5 : 1);
    const pull = 0.34;
    const damp = 0.82;
    const maxX = W - 1, maxY = H - 1;
    let ni = (Math.random() * 65536) | 0;

    for (let i = 0; i < COUNT; i++) {
      const p = i * 2;
      let x = pos[p], y = pos[p + 1], vx = vel[p], vy = vel[p + 1];
      const ix = x | 0, iy = y | 0;
      // Тот же рисунок повторяется вдвое и вчетверо мельче, более тонким слоем песка.
      const scale = i >= HEAVY || i < MEDIUM_GRAINS ? 0 : Number(i >= FINE_GRAINS) + 1;
      const { cnx, cmx, dnx, dmx, cny, cmy, dny, dmy } = fields[scale];

      const a = cnx[ix], b = cmy[iy], c = cmx[ix], d = cny[iy];
      const f = a * b - c * d;
      const gx = dnx[ix] * b - dmx[ix] * d;
      const gy = a * dmy[iy] - c * dny[iy];
      const af = f < 0 ? -f : f;

      let drift, jolt;
      if (i < HEAVY) {
        // Тяжёлый песок уходит туда, где пластина не движется.
        drift = -pull * f;
        // Небольшая дрожь и на узловых линиях: линия остаётся песком, а не нитью.
        jolt = shake * (af + 0.09);
      } else {
        // Лёгкая пыль собирается на пучностях, как в опытах Фарадея.
        drift = pull * 0.55 * f;
        jolt = shake * 0.5 * Math.max(0.12, 1.15 - af);
      }

      ni = (ni + 1) & 65535; vx += drift * gx + NOISE[ni] * jolt;
      ni = (ni + 1) & 65535; vy += drift * gy + NOISE[ni] * jolt;

      // Подпись остаётся чистой: песок обтекает её.
      if (x < keepRight && y > keepTop) {
        if (keepRight - x < y - keepTop) vx += 0.9; else vy -= 0.9;
      }

      for (const stone of stones) {
        const dx = x - stone.x, dy = y - stone.y;
        const reach = stone.size * 1.25;
        if (Math.abs(dx) >= reach || Math.abs(dy) >= reach) continue;
        const distanceSquared = dx * dx + dy * dy;
        if (distanceSquared >= reach * reach) continue;
        const distance = Math.sqrt(distanceSquared) || 1;
        const rim = stone.size * 0.37;
        const force = (distance < rim ? 1.35 : -0.14) * (1 - distance / reach);
        const swirl = stone.energy * (1 - distance / reach) * 0.7;
        vx += (dx * force - dy * swirl) / distance;
        vy += (dy * force + dx * swirl) / distance;
      }

      vx *= damp; vy *= damp;
      x += vx; y += vy;

      if (x < 0) { x = 0; vx = -vx; } else if (x > maxX) { x = maxX; vx = -vx; }
      if (y < 0) { y = 0; vy = -vy; } else if (y > maxY) { y = maxY; vy = -vy; }

      pos[p] = x; pos[p + 1] = y; vel[p] = vx; vel[p + 1] = vy;
    }

    applyStrikes();
  }

  function applyStrikes() {
    const band = 30;
    for (let s = strikes.length - 1; s >= 0; s--) {
      const wave = strikes[s];
      const inner = Math.max(0, wave.r - band), outer = wave.r + band;
      const inner2 = inner * inner, outer2 = outer * outer;
      for (let i = 0; i < COUNT; i++) {
        const p = i * 2;
        const dx = pos[p] - wave.x, dy = pos[p + 1] - wave.y;
        const d2 = dx * dx + dy * dy;
        if (d2 > outer2 || d2 < inner2) continue;
        const dist = Math.sqrt(d2) || 1;
        const kick = wave.power * (1 - Math.abs(dist - wave.r) / band) / dist;
        vel[p] += dx * kick;
        vel[p + 1] += dy * kick;
      }
      wave.r += 13;
      wave.power *= 0.965;
      if (wave.power < 0.35 || wave.r > W + H) strikes.splice(s, 1);
    }
  }

  /* ---------- Рисование ---------- */

  function shader(type, source) {
    const unit = gl.createShader(type);
    gl.shaderSource(unit, source);
    gl.compileShader(unit);
    if (!gl.getShaderParameter(unit, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(unit));
    }
    return unit;
  }

  const program = gl.createProgram();
  gl.attachShader(program, shader(gl.VERTEX_SHADER, `
    attribute vec2 aPos;
    attribute vec3 aGrain;
    uniform vec2 uRes;
    uniform float uDpr;
    uniform vec3 uHeavy;
    uniform vec3 uLight;
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      vec2 c = aPos / uRes * 2.0 - 1.0;
      gl_Position = vec4(c.x, -c.y, 0.0, 1.0);
      gl_PointSize = aGrain.y * uDpr;
      vColor = mix(uHeavy, uLight, aGrain.x) * aGrain.z;
      vAlpha = mix(0.72, 0.49, aGrain.x);
    }
  `));
  gl.attachShader(program, shader(gl.FRAGMENT_SHADER, `
    precision mediump float;
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      gl_FragColor = vec4(vColor, vAlpha * smoothstep(0.5, 0.3, d));
    }
  `));
  gl.linkProgram(program);
  gl.useProgram(program);

  const grain = new Float32Array(COUNT * 3);
  for (let i = 0; i < COUNT; i++) {
    const light = i >= HEAVY;
    const fine = i < HEAVY && i >= MEDIUM_GRAINS;
    grain[i * 3] = light ? 1 : fine ? 0.13 : 0;
    grain[i * 3 + 1] = (fine ? 0.9 : light ? 1.3 : 1.5) + Math.random() * 1.1;
    grain[i * 3 + 2] = 0.82 + Math.random() * 0.36;
  }

  const posBuffer = gl.createBuffer();
  const aPos = gl.getAttribLocation(program, 'aPos');
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, pos.byteLength, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const grainBuffer = gl.createBuffer();
  const aGrain = gl.getAttribLocation(program, 'aGrain');
  gl.bindBuffer(gl.ARRAY_BUFFER, grainBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, grain, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(aGrain);
  gl.vertexAttribPointer(aGrain, 3, gl.FLOAT, false, 0, 0);

  const uRes = gl.getUniformLocation(program, 'uRes');
  const uDpr = gl.getUniformLocation(program, 'uDpr');
  const uHeavy = gl.getUniformLocation(program, 'uHeavy');
  gl.uniform3fv(gl.getUniformLocation(program, 'uLight'), OCHRE);

  gl.enable(gl.BLEND);
  gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.clearColor(0, 0, 0, 0);

  function draw() {
    for (let i = 0; i < 3; i++) heavyColor[i] += (heavyTarget[i] - heavyColor[i]) * 0.05;
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(uRes, W, H);
    gl.uniform1f(uDpr, dpr);
    gl.uniform3fv(uHeavy, heavyColor);
    gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, pos);
    gl.drawArrays(gl.POINTS, 0, COUNT);
  }

  /* ---------- Звук ---------- */

  let audio, instrument, loading;
  let soundOn = true;
  let pendingUpdate = false;

  function updateInstrument() {
    const pulse = leafPulse(leaf.x / W, leaf.y / H);
    const status = `Пульс ${Math.round(pulse * 100)}%`;
    if (pulseStatus.textContent !== status) pulseStatus.textContent = status;
    instrument?.update({
      pulse,
      harmony: stoneHarmony(firstRock.x / W, secondRock.x / W),
      flute: branch.active,
      branchX: branch.x / W,
      branchY: branch.y / H,
      muted: !soundOn,
    });
  }

  function updateAfterMove() {
    if (pendingUpdate) return;
    pendingUpdate = true;
    requestAnimationFrame(() => {
      pendingUpdate = false;
      updateInstrument();
    });
  }

  function loadSound() {
    if (!audio) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) {
        soundButton.textContent = 'Звук недоступен';
        return Promise.resolve(null);
      }
      audio = new AudioContext();
    }
    if (audio.state !== 'running') audio.resume().catch(() => {});
    if (instrument) return Promise.resolve(instrument);
    if (!loading) {
      soundButton.textContent = 'Загружаю звук…';
      soundButton.disabled = true;
      loading = createSoundscape(audio).then((garden) => {
        instrument = garden;
        updateInstrument();
        soundButton.textContent = soundOn ? 'Выключить звук' : 'Включить звук';
        return garden;
      }).catch((error) => {
        console.error(error);
        soundButton.textContent = 'Повторить загрузку звука';
        return null;
      }).finally(() => {
        loading = undefined;
        soundButton.disabled = false;
      });
    }
    return loading;
  }

  soundButton.addEventListener('click', () => {
    if (!instrument) {
      loadSound();
      return;
    }
    soundOn = !soundOn;
    loadSound();
    updateInstrument();
    soundButton.textContent = soundOn ? 'Выключить звук' : 'Включить звук';
  });

  function playGesture(name, object, amount) {
    loadSound().then((garden) => garden?.play(name, object.x / W, amount));
  }

  /* ---------- Действия в браузере ---------- */

  function mark(action) {
    const row = document.querySelector(`[data-action="${action}"]`);
    if (row) row.classList.add('done');
  }

  function placeStone(stone, x, y) {
    const inset = stone.size / 2 + 4;
    x = Math.max(inset, Math.min(W - inset, x));
    y = Math.max(inset, Math.min(H - inset, y));
    const panelEdge = keepTop - Math.max(0, inset - 22);
    if (x < keepRight && y > panelEdge && panelEdge > inset) {
      y = panelEdge;
    }
    stone.x = x;
    stone.y = y;
    stone.element.style.setProperty('--x', `${x}px`);
    stone.element.style.setProperty('--y', `${y}px`);
  }

  function moveStone(stone, x, y) {
    const oldX = stone.x, oldY = stone.y;
    placeStone(stone, x, y);
    const speed = Math.hypot(stone.x - oldX, stone.y - oldY);
    stone.energy = Math.min(1, stone.energy + speed * 0.04);
    lastTouch = performance.now();
    mark(stone.element.dataset.role);
    updateAfterMove();
  }

  const arrowOffsets = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  for (const stone of objects) {
    const { element } = stone;
    let drag = null, moved = false;
    if (stone !== bowl) {
      element.addEventListener('pointerdown', (event) => {
        if (drag || event.button !== 0) return;
        moved = false;
        drag = { id: event.pointerId, x: event.clientX - stone.x, y: event.clientY - stone.y, startX: event.clientX, startY: event.clientY };
        element.setPointerCapture(event.pointerId);
        element.dataset.dragging = '';
      });
      element.addEventListener('pointermove', (event) => {
        if (drag?.id !== event.pointerId) return;
        if (Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) > 4) moved = true;
        if (moved) moveStone(stone, event.clientX - drag.x, event.clientY - drag.y);
      });
      element.addEventListener('pointerup', () => {
        if (!moved) return;
        updateInstrument();
        if (stone === branch) playGesture('flute-call', branch, .90);
        else if (stone === leaf) loadSound();
        else playGesture('stone-brush', stone, .78);
      });
      element.addEventListener('lostpointercapture', () => {
        drag = null;
        delete element.dataset.dragging;
      });
      element.addEventListener('keydown', (event) => {
        const offset = arrowOffsets[event.key];
        if (!offset) return;
        event.preventDefault();
        const step = event.shiftKey ? 30 : 12;
        moveStone(stone, stone.x + offset[0] * step, stone.y + offset[1] * step);
        loadSound();
      });
    }
    element.addEventListener('click', (event) => {
      if (moved && event.detail > 0) return;
      if (stone === bowl) {
        playGesture('bowl-hit', bowl, .94);
      } else if (stone === leaf) {
        const centered = leafPulse(leaf.x / W, leaf.y / H) > .42;
        moveStone(leaf, W * (centered ? .87 : .52), H * (centered ? .40 : .43));
        loadSound();
      } else if (stone === branch) {
        branch.active = !branch.active;
        branch.element.setAttribute('aria-pressed', String(branch.active));
        updateInstrument();
        if (branch.active) playGesture('flute-call', branch, .90);
      } else {
        playGesture('stone-brush', stone, .78);
      }
      mark(element.dataset.role);
    });
  }

  let lastX = null, lastY = null;
  addEventListener('pointermove', (event) => {
    if (event.target instanceof Element && event.target.closest('.stone')) {
      lastX = lastY = null;
      return;
    }
    lastTouch = performance.now();
    targetN = 1 + (event.clientX / W) * 6;
    targetM = targetN + 1 + (event.clientY / H) * 4;
    if (lastX !== null) {
      const speed = Math.hypot(event.clientX - lastX, event.clientY - lastY);
      excite = Math.min(1, excite + speed * 0.0012);
    }
    lastX = event.clientX;
    lastY = event.clientY;
  });

  canvas.addEventListener('pointerdown', (event) => {
    loadSound();
    lastTouch = performance.now();
    strikes.push({ x: event.clientX, y: event.clientY, r: 0, power: calm ? 3 : 6 });
    if (strikes.length > 4) strikes.shift();
    excite = Math.min(1, excite + 0.4);
    if (instrument) instrument.play('stone-brush', event.clientX / W, .24);
  });

  addEventListener('wheel', (event) => {
    if (event.target instanceof Element && panel.contains(event.target)) return;
    drive = Math.min(1, Math.max(0.05, drive - event.deltaY * 0.0008));
  }, { passive: true });

  const pairs = [];
  for (let a = 1; a <= 7; a++) {
    for (let gap = 1; gap <= 5; gap++) pairs.push([a, a + gap]);
  }
  pairs.sort((p, q) => toHz(p[0], p[1]) - toHz(q[0], q[1]));

  const KEYS = {};
  let keyIndex = 0;
  for (const [letters, pigment] of [
    ['ZXCVBNM', PIGMENT.indigo],
    ['ASDFGHJKL', PIGMENT.pine],
    ['QWERTYUIOP', PIGMENT.garnet],
  ]) {
    for (const letter of letters) {
      const pair = pairs[Math.round(keyIndex * (pairs.length - 1) / 25)];
      KEYS['Key' + letter] = { n: pair[0], m: pair[1], pigment };
      keyIndex++;
    }
  }

  addEventListener('keydown', (event) => {
    if (event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
    const key = KEYS[event.code];
    if (!key) return;
    loadSound();
    lastTouch = performance.now();
    targetN = key.n;
    targetM = key.m;
    heavyTarget = key.pigment;
    excite = 1;
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    scatter();
    excite = 1;
  });

  addEventListener('resize', () => {
    const oldW = W, oldH = H;
    resize();
    // Песок растягивается вместе с окном и не остаётся в прежних границах.
    const scaleX = (W - 1) / Math.max(oldW - 1, 1);
    const scaleY = (H - 1) / Math.max(oldH - 1, 1);
    for (let i = 0; i < COUNT; i++) {
      pos[i * 2] *= scaleX;
      pos[i * 2 + 1] *= scaleY;
    }
    for (const stone of objects) {
      stone.size = stone.element.offsetWidth;
      placeStone(stone, stone.x * scaleX, stone.y * scaleY);
    }
    updateInstrument();
  });

  /* ---------- Цикл ---------- */

  const TICK = 1000 / 60;
  let last = performance.now(), backlog = 0, lastRead = 0;

  function frame(now) {
    backlog += Math.min(now - last, 50);
    last = now;
    for (let done = 0; backlog >= TICK && done < 2; done++) {
      step();
      backlog -= TICK;
    }
    if (backlog > TICK) backlog = 0;
    draw();
    if (now - lastRead > 120) {
      readout.textContent = `Вибрация ${Math.round(drive * 100)}%`;
      lastRead = now;
    }
    requestAnimationFrame(frame);
  }

  // Высота панели меняется от шрифта и ширины окна, зона без песка следует за ней.
  new ResizeObserver(() => {
    measurePanel();
    for (const stone of objects) placeStone(stone, stone.x, stone.y);
    updateInstrument();
  }).observe(panel);

  updateInstrument();
  if (calm) for (let i = 0; i < 240; i++) step();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
